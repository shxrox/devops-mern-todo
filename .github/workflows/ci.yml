name: MERN CI

on:
  push:
    branches: [main]

jobs:
  mongo-init:
    runs-on: ubunth-latest
    services:
      image: mongo
      ports: ['27017:27017']
    
    steps:
      - name : Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: wait for MongoDB to be ready
        run: |
          until nc -z localhost 27017; do
            echo "Waiting for MongoDB..."
            sleep 2
          done
            echo "MongoDB is up"
      
      - name: Seed MongoDB
        working-directory: ./backend
        run: | 
          npm install
          node seedTaskData.js
  test:
    runs-on: ubuntu-latest

    steps:
      - name : Checkout repository
        uses: actions/checkout@v3

      - name : Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install backend dependencies and run tests
        run: npm install

      - name: Run backend tests
        run: npm test    
          
    


        
    